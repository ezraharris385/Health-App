name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/health-tracking-app-om50sl]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p client/tsconfig.json --noEmit
      - run: npm run build:pages
      # Publish to the gh-pages branch, which GitHub Pages serves directly —
      # no Pages management API needed (the API enablement path is blocked for
      # this token: "Resource not accessible by integration").
      - name: Publish to gh-pages
        run: |
          cd client/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
